<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" fill="none">
  <defs>
    <linearGradient id="fav-poly-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fav-poly-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="fav-poly-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Modern Precision Isometric Tech Crest (40x40) -->
  <g transform="translate(2, 2)">
    <!-- Top Rhombus Facet -->
    <polygon points="20,2 38,12 20,22 2,12" fill="url(#fav-poly-top)" />
    <!-- Left Facet -->
    <polygon points="2,12 20,22 20,38 2,28" fill="url(#fav-poly-left)" />
    <!-- Right Facet -->
    <polygon points="20,22 38,12 38,28 20,38" fill="url(#fav-poly-right)" />
    
    <!-- Dynamic Inner Core S-A Geometry -->
    <polyline points="10,18 20,24 20,32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="30,18 20,12 10,18" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <circle cx="20" cy="22" r="3" fill="#FFFFFF" />
  </g>
</svg>