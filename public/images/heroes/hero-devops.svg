<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="devops-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060A14" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>
    <pattern id="dot-matrix" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="rgba(255, 255, 255, 0.05)" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#devops-bg)" />
  <rect width="100%" height="100%" fill="url(#dot-matrix)" />

  <circle cx="80%" cy="30%" r="550" fill="url(#cyan-glow)" />
  <circle cx="15%" cy="80%" r="600" fill="url(#cyan-glow)" />

  <!-- Server Topology & Infrastructure Paths -->
  <g stroke="rgba(14, 165, 233, 0.2)" stroke-width="1.5" fill="none">
    <circle cx="960" cy="540" r="300" stroke-dasharray="6, 6" />
    <circle cx="960" cy="540" r="480" stroke-dasharray="10, 8" />
    <line x1="200" y1="540" x2="1720" y2="540" />
    <line x1="960" y1="100" x2="960" y2="980" />
    <path d="M 660 540 L 960 240 L 1260 540 L 960 840 Z" stroke="rgba(37, 99, 235, 0.3)" />
  </g>

  <!-- Server status indicators -->
  <g fill="#0284C7">
    <circle cx="960" cy="240" r="5" />
    <circle cx="1260" cy="540" r="5" />
    <circle cx="960" cy="840" r="5" />
    <circle cx="660" cy="540" r="5" />
  </g>
</svg>
