<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="dev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C17" />
      <stop offset="50%" stop-color="#08162C" />
      <stop offset="100%" stop-color="#0D2447" />
    </linearGradient>
    <pattern id="server-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(14, 165, 233, 0.12)" stroke-width="1.2" />
      <circle cx="20" cy="20" r="1.5" fill="rgba(14, 165, 233, 0.2)" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#dev-bg)" />
  <rect width="100%" height="100%" fill="url(#server-grid)" />

  <!-- VISIBLE DEVOPS INFRASTRUCTURE & TERMINAL SCENE -->
  <g transform="translate(100, 20)">
    <!-- Server Rack Frame (Right-Side Visual) -->
    <rect x="960" y="140" width="380" height="740" rx="14" fill="#060C17" stroke="#1E40AF" stroke-width="3" />
    <!-- Rack Header -->
    <rect x="960" y="140" width="380" height="45" rx="14" fill="#0A1832" />
    <text x="980" y="170" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">CONTABO LINUX VPS • UBUNTU 22.04 LTS</text>

    <!-- Rack Server Unit 1: Nginx & Reverse Proxy -->
    <g transform="translate(980, 205)">
      <rect width="340" height="95" rx="8" fill="#0B1A36" stroke="#2563EB" stroke-width="2" />
      <circle cx="24" cy="30" r="6" fill="#10B981" />
      <circle cx="44" cy="30" r="6" fill="#10B981" />
      <circle cx="64" cy="30" r="6" fill="#38BDF8" />
      <text x="85" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">REVERSE PROXY (NGINX)</text>
      <text x="24" y="65" fill="#93C5FD" font-family="monospace" font-size="12">Port 80 / 443 → Port 3000 (Node.js)</text>
      <text x="24" y="82" fill="#10B981" font-family="monospace" font-size="11">SSL: Let's Encrypt Wildcard Valid</text>
    </g>

    <!-- Rack Server Unit 2: PM2 Cluster Engine -->
    <g transform="translate(980, 320)">
      <rect width="340" height="95" rx="8" fill="#0B1A36" stroke="#0284C7" stroke-width="2" />
      <circle cx="24" cy="30" r="6" fill="#10B981" />
      <circle cx="44" cy="30" r="6" fill="#10B981" />
      <circle cx="64" cy="30" r="6" fill="#10B981" />
      <text x="85" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">PM2 PROCESS MANAGER</text>
      <text x="24" y="65" fill="#93C5FD" font-family="monospace" font-size="12">Instances: 4 Workers (Cluster Mode)</text>
      <text x="24" y="82" fill="#38BDF8" font-family="monospace" font-size="11">Uptime: 99.98% • Auto-Restart: Active</text>
    </g>

    <!-- Rack Server Unit 3: Apache Virtual Hosts & ERPNext -->
    <g transform="translate(980, 435)">
      <rect width="340" height="95" rx="8" fill="#0B1A36" stroke="#3B82F6" stroke-width="2" />
      <circle cx="24" cy="30" r="6" fill="#10B981" />
      <circle cx="44" cy="30" r="6" fill="#38BDF8" />
      <text x="65" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">APACHE VIRTUAL HOSTS</text>
      <text x="24" y="65" fill="#93C5FD" font-family="monospace" font-size="12">Multi-tenant Domain VirtualHost Rules</text>
      <text x="24" y="82" fill="#10B981" font-family="monospace" font-size="11">ERPNext v15 Bench &amp; MariaDB</text>
    </g>

    <!-- Rack Server Unit 4: Firewall & Security -->
    <g transform="translate(980, 550)">
      <rect width="340" height="95" rx="8" fill="#0B1A36" stroke="#1D4ED8" stroke-width="2" />
      <circle cx="24" cy="30" r="6" fill="#10B981" />
      <text x="44" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">UFW FIREWALL &amp; FAIL2BAN</text>
      <text x="24" y="65" fill="#93C5FD" font-family="monospace" font-size="12">SSH Key-Only Auth • Brute-force Block</text>
      <text x="24" y="82" fill="#10B981" font-family="monospace" font-size="11">Zero Open Vulnerabilities</text>
    </g>

    <!-- Rack Server Unit 5: DNS & Mail Server Management -->
    <g transform="translate(980, 665)">
      <rect width="340" height="85" rx="8" fill="#0B1A36" stroke="#2563EB" stroke-width="2" />
      <text x="24" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">DNS &amp; MX / SPF / DKIM RECORDS</text>
      <text x="24" y="58" fill="#93C5FD" font-family="monospace" font-size="12">Cloudflare CDN + Custom Business Mail</text>
    </g>

    <!-- Interactive Terminal Console Window next to Rack -->
    <g transform="translate(1380, 160)">
      <rect width="400" height="520" rx="10" fill="#040913" stroke="#0284C7" stroke-width="2" />
      <!-- Terminal Header -->
      <rect width="400" height="34" rx="10" fill="#0A1832" />
      <circle cx="18" cy="17" r="5" fill="#EF4444" />
      <circle cx="34" cy="17" r="5" fill="#F59E0B" />
      <circle cx="50" cy="17" r="5" fill="#10B981" />
      <text x="75" y="22" fill="#93C5FD" font-family="monospace" font-size="12" font-weight="700">soham@contabo-vps:~$</text>

      <!-- Terminal Output Lines -->
      <text x="20" y="68" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">soham@vps:~$ pm2 status</text>
      <text x="20" y="96" fill="#10B981" font-family="monospace" font-size="12">┌─────┬──────────────┬────────┬──────────┐</text>
      <text x="20" y="118" fill="#10B981" font-family="monospace" font-size="12">│ id  │ name         │ status │ uptime   │</text>
      <text x="20" y="140" fill="#10B981" font-family="monospace" font-size="12">├─────┼──────────────┼────────┼──────────┤</text>
      <text x="20" y="162" fill="#FFFFFF" font-family="monospace" font-size="12">│ 0   │ nextjs-prod  │ <tspan fill="#10B981" font-weight="700">online</tspan> │ 45d 12h  │</text>
      <text x="20" y="184" fill="#FFFFFF" font-family="monospace" font-size="12">│ 1   │ express-api  │ <tspan fill="#10B981" font-weight="700">online</tspan> │ 45d 12h  │</text>
      <text x="20" y="206" fill="#FFFFFF" font-family="monospace" font-size="12">│ 2   │ erpnext-v15  │ <tspan fill="#10B981" font-weight="700">online</tspan> │ 32d 08h  │</text>
      <text x="20" y="228" fill="#10B981" font-family="monospace" font-size="12">└─────┴──────────────┴────────┴──────────┘</text>

      <text x="20" y="275" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">soham@vps:~$ certbot certificates</text>
      <text x="20" y="305" fill="#93C5FD" font-family="monospace" font-size="12">Certificate Name: *.integralwebsolution.com</text>
      <text x="20" y="330" fill="#10B981" font-family="monospace" font-size="12">Expiry Date: 2026-12-31 (VALID)</text>

      <text x="20" y="380" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">soham@vps:~$ nginx -t</text>
      <text x="20" y="410" fill="#10B981" font-family="monospace" font-size="12">nginx: configuration syntax is ok</text>
      <text x="20" y="435" fill="#10B981" font-family="monospace" font-size="12">nginx: test is successful</text>

      <text x="20" y="485" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">soham@vps:~$ <tspan fill="#FFFFFF">_</tspan></text>
    </g>
  </g>
</svg>