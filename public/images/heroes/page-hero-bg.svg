<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="page-hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <pattern id="page-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#page-hero-grad)" />
  <rect width="100%" height="100%" fill="url(#page-grid)" />
  <circle cx="85%" cy="30%" r="450" fill="url(#accent-glow)" />

  <g stroke="rgba(37, 99, 235, 0.2)" stroke-width="1.5" fill="none">
    <path d="M 0 350 L 500 350 L 650 250 L 1400 250 L 1550 350 L 1920 350" />
  </g>
</svg>
