<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="seo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="50%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#091124" />
    </linearGradient>
    <linearGradient id="sapphire-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </linearGradient>
    <pattern id="diagonal-lines" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 0 50 L 50 0" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#seo-bg)" />
  <rect width="100%" height="100%" fill="url(#diagonal-lines)" />

  <circle cx="50%" cy="40%" r="550" fill="url(#sapphire-glow)" />

  <!-- Global Network & Search Performance Curves -->
  <g stroke="rgba(59, 130, 246, 0.25)" stroke-width="2" fill="none">
    <path d="M 100 850 C 400 800, 700 700, 1000 450 C 1300 200, 1600 150, 1850 120" />
    <path d="M 100 900 C 400 860, 700 780, 1000 580 C 1300 380, 1600 300, 1850 250" stroke-dasharray="8, 6" stroke="rgba(2, 132, 199, 0.2)" />
  </g>

  <g fill="#60A5FA">
    <circle cx="1000" cy="450" r="5" />
    <circle cx="1300" cy="200" r="5" />
    <circle cx="1600" cy="150" r="5" />
    <circle cx="1850" cy="120" r="6" />
  </g>
</svg>
