<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="60" cy="0" r="1.5" fill="rgba(37, 99, 235, 0.4)" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient light gradients -->
  <circle cx="20%" cy="20%" r="500" fill="url(#glow)" />
  <circle cx="85%" cy="75%" r="600" fill="url(#glow)" />

  <!-- Code/Structure Architecture Lines -->
  <g stroke="rgba(37, 99, 235, 0.25)" stroke-width="1.5" fill="none">
    <path d="M 100 200 L 400 200 L 500 300 L 900 300" />
    <path d="M 300 800 L 600 800 L 700 700 L 1200 700" />
    <path d="M 1200 150 L 1400 150 L 1500 250 L 1800 250" />
    <path d="M 1000 900 L 1300 900 L 1400 800 L 1700 800" />
  </g>

  <!-- Glowing Nodes -->
  <g fill="#38BDF8">
    <circle cx="500" cy="300" r="4" />
    <circle cx="700" cy="700" r="4" />
    <circle cx="1500" cy="250" r="4" />
    <circle cx="1400" cy="800" r="4" />
  </g>
</svg>
