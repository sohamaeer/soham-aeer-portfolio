<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" width="240" height="44" fill="none">
  <defs>
    <linearGradient id="logo-poly-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="logo-poly-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="logo-poly-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Modern Precision Isometric Tech Crest (40x40) -->
  <g transform="translate(2, 2)">
    <!-- Top Rhombus Facet -->
    <polygon points="20,2 38,12 20,22 2,12" fill="url(#logo-poly-top)" />
    <!-- Left Facet -->
    <polygon points="2,12 20,22 20,38 2,28" fill="url(#logo-poly-left)" />
    <!-- Right Facet -->
    <polygon points="20,22 38,12 38,28 20,38" fill="url(#logo-poly-right)" />
    
    <!-- Dynamic Inner Core S-A Geometry -->
    <polyline points="10,18 20,24 20,32" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="30,18 20,12 10,18" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <circle cx="20" cy="22" r="2.8" fill="#FFFFFF" />
  </g>

  <!-- Typography: SOHAM AEER & FULL STACK DEVELOPER -->
  <g transform="translate(54, 8)">
    <text x="0" y="18" fill="currentColor" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="0.05em">SOHAM AEER</text>
    <!-- Dot accent -->
    <circle cx="138" cy="13" r="3" fill="#0052CC" />
    <text x="0" y="31" fill="#0052CC" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.16em">FULL STACK DEVELOPER</text>
  </g>
</svg>